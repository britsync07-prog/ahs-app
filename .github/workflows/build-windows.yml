name: Build Windows Installer

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: vault-desktop-tauri/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        working-directory: vault-desktop-tauri
        run: npm install

      - name: Build Tauri app
        working-directory: vault-desktop-tauri
        run: npm run tauri build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vault-windows-installer
          path: |
            vault-desktop-tauri/src-tauri/target/release/bundle/nsis/*.exe
            vault-desktop-tauri/src-tauri/target/release/bundle/msi/*.msi
